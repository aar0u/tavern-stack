# SillyTavern for another machine on the home network: only SillyTavern and its init, no gateway, no image bridge.
# It is not started from here: pack-lite.sh puts it into the package as docker-compose.yml, next to init.sh, merge-settings.mjs and the
# seed, and there it is started with
#
#   docker compose up -d
#   docker compose up -d --force-recreate    # to apply a changed ./seed again
#
# It talks to the gateway running on the main machine, which has to listen on the LAN there (README, "别的机器上的 ST 用这个网关").
# The main machine's address is LLM_HOST, in the .env next to this file (pack-lite.sh writes it from the main machine's own .env).
#
# Everything is kept under ./data (unlike the main setup, which lives on a ramdisk), so chats survive a reboot; back them up from there.
# The seed beats the settings changed in the UI every time st-init runs. For settings of their own, copy ./seed to another directory
# and start with SEED_DIR=./seed-own.

name: st-lite

services:
  # Docker creates missing bind mount directories root-owned, which the node user (1000) of the other containers cannot write to.
  st-perms:
    image: ghcr.io/sillytavern/sillytavern:latest
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /f/config /f/data /f/plugins /f/extensions || true"]
    volumes:
      - "./data/config:/f/config"
      - "./data/data:/f/data"
      - "./data/plugins:/f/plugins"
      - "./data/extensions:/f/extensions"
    restart: "no"

  # Applies the seed (settings merged in, quick replies copied over) before SillyTavern starts; installs the extensions on the first run.
  st-init:
    image: ghcr.io/sillytavern/sillytavern:latest
    user: "1000:1000"
    entrypoint: ["sh", "/init.sh"]
    depends_on:
      st-perms:
        condition: service_completed_successfully
    volumes:
      - "./init.sh:/init.sh:ro"
      - "./merge-settings.mjs:/merge-settings.mjs:ro"
      - "${SEED_DIR:-./seed}:/seed:ro"
      - "./data/data:/home/node/app/data"
      - "./data/plugins:/home/node/app/plugins"
      - "./data/extensions:/home/node/app/public/scripts/extensions/third-party"
    restart: "no"

  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:latest
    depends_on:
      st-init:
        condition: service_completed_successfully
    # The seed points the chat API at http://gateway:8789/v1; here that name is the main machine, so the seed needs no change.
    extra_hosts:
      - "gateway:${LLM_HOST:?the main machine's address: put LLM_HOST in .env next to this file}"
    environment:
      - NODE_ENV=production
      - FORCE_COLOR=1
      - SILLYTAVERN_HEARTBEATINTERVAL=30
      - SILLYTAVERN_ENABLESERVERPLUGINS=true   # for the Edge TTS plugin installed by st-init
      - PUID=1000
      - PGID=1000
      # 172.16.0.0/12 covers the Docker bridge networks; ST_LAN_CIDR is the LAN that may open the page.
      - 'SILLYTAVERN_WHITELIST=["127.0.0.1","::1","172.16.0.0/12","${ST_LAN_CIDR:-192.168.0.0/16}"]'
      # - SILLYTAVERN_BASICAUTHMODE=true
      # - SILLYTAVERN_BASICAUTHUSER_USERNAME=user
      # - SILLYTAVERN_BASICAUTHUSER_PASSWORD=change-me
    ports:
      - "8000:8000"
    volumes:
      - "./data/config:/home/node/app/config"
      - "./data/data:/home/node/app/data"
      - "./data/plugins:/home/node/app/plugins"
      - "./data/extensions:/home/node/app/public/scripts/extensions/third-party"
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
