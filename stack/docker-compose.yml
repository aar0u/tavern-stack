# Start it with ./st.sh, which sets ST_ROOT (the state directory) from $SCRATCH. deploy_to_mc.sh runs it with a .env of its own
# (ST_ROOT=./data, ST_RESTART, ST_LAN_CIDR), so the same file serves both hosts.

name: st

# All state lives under $ST_ROOT/{config,data,plugins,extensions}; on the main host that is a ramdisk, chats included.
services:
  # Docker creates missing bind mount directories root-owned, which the node user (1000) cannot write to.
  st-perms:
    container_name: st-perms
    image: ghcr.io/sillytavern/sillytavern:latest
    user: "0:0"
    entrypoint: ["sh", "-c", "cd /st_root && mkdir -p config data plugins extensions && chown 1000:1000 config data plugins extensions"]
    volumes:
      - "${ST_ROOT:?}:/st_root"
    restart: "no"

  # An OpenAI-compatible gateway at http://gateway:8789/v1: ./gateway.mjs in front of any upstream, with retries and fixes for Gemini.
  # SillyTavern reaches it by the service name on this project's own network. Only the upstream address and key come from
  # gateway.env. The upstream is a service on the internet, a container reached through a published port, or a program on the host
  # (host.docker.internal); nothing here knows which.
  gateway:
    container_name: gateway
    image: node:22-alpine
    user: "1000:1000"
    command: ["node", "/app/gateway.mjs"]
    env_file: gateway.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
    volumes:
      - "./gateway.mjs:/app/gateway.mjs:ro"
    # No authentication: whoever reaches this port uses the upstream.
    ports:
      - "0.0.0.0:8789:8789"
    stop_grace_period: 20s
    restart: "${ST_RESTART:-no}"

  # One-shot: applies ./seed (settings.json merged in, avatars copied over) before SillyTavern starts.
  st-init:
    container_name: st-init
    image: ghcr.io/sillytavern/sillytavern:latest
    user: "1000:1000"
    entrypoint: ["sh", "/init.sh"]
    depends_on:
      st-perms:
        condition: service_completed_successfully
    volumes:
      - "./init.sh:/init.sh:ro"
      - "./merge-settings.mjs:/merge-settings.mjs:ro"
      - "./seed:/seed:ro"
      - "${ST_ROOT:?}/data:/home/node/app/data"
      - "${ST_ROOT:?}/plugins:/home/node/app/plugins"
      - "${ST_ROOT:?}/extensions:/home/node/app/public/scripts/extensions/third-party"
    restart: "no"

  sillytavern:
    container_name: sillytavern
    hostname: sillytavern
    image: ghcr.io/sillytavern/sillytavern:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      st-init:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - FORCE_COLOR=1
      - SILLYTAVERN_HEARTBEATINTERVAL=30
      - SILLYTAVERN_ENABLESERVERPLUGINS=true   # for the Edge TTS plugin installed by st-init
      # /proxy/<url> makes SillyTavern fetch <url> for the browser, which the card's pre-battle parsing needs to reach the LLM API.
      # Anyone who reaches port 8000 can make the server fetch any address it can reach.
      - SILLYTAVERN_ENABLECORSPROXY=true
      - PUID=1000
      - PGID=1000
      # 172.16.0.0/12 covers all Docker bridge networks; ST_LAN_CIDR is the LAN that may reach it (phone).
      - 'SILLYTAVERN_WHITELIST=["127.0.0.1","::1","172.16.0.0/12","${ST_LAN_CIDR:-192.168.0.0/16}"]'
      # - SILLYTAVERN_BASICAUTHMODE=true
      # - SILLYTAVERN_BASICAUTHUSER_USERNAME=user
      # - SILLYTAVERN_BASICAUTHUSER_PASSWORD=change-me
    ports:
      - "8000:8000"
    volumes:
      - "${ST_ROOT:?}/config:/home/node/app/config"
      - "${ST_ROOT:?}/data:/home/node/app/data"
      - "${ST_ROOT:?}/plugins:/home/node/app/plugins"
      - "${ST_ROOT:?}/extensions:/home/node/app/public/scripts/extensions/third-party"
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    # On the main host not at boot: the bind sources are on the ramdisk, empty then, and st.sh recreates them first.
    # deploy_to_mc.sh sets ST_RESTART=unless-stopped, where the state is on disk.
    restart: "${ST_RESTART:-no}"
